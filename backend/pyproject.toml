[project]
name = "orderloop-api"
version = "0.1.0"
description = "OrderLoop: returns and refunds console API (training sample)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
    "mcp[cli]>=2.0.0",
    "claude-agent-sdk>=0.2.174",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../mcp"]
